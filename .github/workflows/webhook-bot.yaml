name: Webhook Bot Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - "webhook-bot/**"

jobs:
  # # No CI yet
  # ci:
  #   if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '#no-ci') }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(join(toJson(github.event.commits.*.message), ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy worker
        working-directory: webhook-bot
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
